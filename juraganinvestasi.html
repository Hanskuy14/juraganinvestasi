<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f172a" />
  <title>Juragan Investasi: Capitalist Tycoon</title>

  <!-- Tailwind via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            mandiri: { DEFAULT: '#003D79', accent: '#FFD700' },
            bca:     { DEFAULT: '#0060AF', accent: '#FFFFFF' },
            bni:     { DEFAULT: '#006A6E', accent: '#F26722' },
            ink:     { 950: '#070b14', 900: '#0b1220', 800: '#111a2e' }
          },
          fontFamily: {
            display: ['"Inter"', 'system-ui', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace']
          }
        }
      }
    }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />

  <style>
/* ==========================================================================
   Juragan Investasi - Custom styles (Phase 1)
   Tailwind handles the bulk; this file covers animations & micro-polish.
   ========================================================================== */

* { -webkit-tap-highlight-color: transparent; }

html, body { height: 100%; }

body {
  overscroll-behavior-y: none;
}

/* ---------- Intro typing cursor ---------- */
.intro-cursor {
  display: inline-block;
  margin-left: 2px;
  animation: blink 1s step-end infinite;
  color: #34d399;
}

@keyframes blink {
  0%, 50%   { opacity: 1; }
  51%, 100% { opacity: 0; }
}

/* ---------- Intro fades ---------- */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}

.animate-fade-in-1 {
  animation: fadeIn 0.6s ease-out 0.1s forwards;
}
.animate-fade-in-2 {
  animation: fadeIn 0.6s ease-out 1.6s forwards;
}

#intro-screen.fade-out {
  opacity: 0;
  pointer-events: none;
}

/* ---------- Tab panel fade-in ---------- */
.tab-panel:not(.hidden) {
  animation: panelFade 0.3s ease-out;
}
@keyframes panelFade {
  from { opacity: 0; transform: translateY(4px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ---------- Desktop browser tabs ---------- */
.desktop-tab {
  position: relative;
  padding: 0.6rem 1rem;
  font-size: 0.8rem;
  color: #94a3b8;
  cursor: pointer;
  white-space: nowrap;
  border-top-left-radius: 0.5rem;
  border-top-right-radius: 0.5rem;
  transition: background 0.15s, color 0.15s;
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
}
.desktop-tab:hover {
  background: rgba(255,255,255,0.04);
  color: #e2e8f0;
}
.desktop-tab.active {
  background: #f1f5f9;
  color: #0f172a;
  font-weight: 600;
}
.desktop-tab.active::after {
  content: '';
  position: absolute;
  left: 0; right: 0; bottom: -1px;
  height: 2px;
  background: #f1f5f9;
}

/* ---------- Mobile bottom nav buttons ---------- */
.mnav-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  padding: 0.55rem 0.25rem;
  color: #94a3b8;
  transition: color 0.15s, background 0.15s;
}
.mnav-btn.active {
  color: #34d399;
}
.mnav-btn:active {
  background: rgba(255,255,255,0.05);
}

/* ---------- Mobile drawer items ---------- */
.mdrawer-btn {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  width: 100%;
  padding: 0.75rem 1.25rem;
  color: #cbd5e1;
  text-align: left;
  transition: background 0.15s;
}
.mdrawer-btn:hover { background: rgba(255,255,255,0.04); }
.mdrawer-btn.active {
  background: rgba(52,211,153,0.1);
  color: #34d399;
  border-left: 3px solid #34d399;
  padding-left: calc(1.25rem - 3px);
}

/* ---------- Bank cards ---------- */
.bank-card {
  border-radius: 1rem;
  overflow: hidden;
  position: relative;
  box-shadow: 0 10px 30px -12px rgba(0,0,0,0.25);
}
.bank-card .gloss {
  position: absolute; inset: 0;
  background: radial-gradient(circle at 20% 0%, rgba(255,255,255,0.18), transparent 50%);
  pointer-events: none;
}
.bank-card-mandiri {
  background: linear-gradient(135deg, #003D79 0%, #00264a 100%);
}
.bank-card-bca {
  background: linear-gradient(135deg, #0060AF 0%, #003e75 100%);
}
.bank-card-bni {
  background: linear-gradient(135deg, #006A6E 0%, #003a3c 100%);
}

/* ---------- XP progress ---------- */
.xp-bar {
  height: 10px;
  border-radius: 999px;
  background: rgba(15, 23, 42, 0.08);
  overflow: hidden;
}
.xp-bar > span {
  display: block;
  height: 100%;
  background: linear-gradient(90deg, #34d399, #14b8a6);
  border-radius: 999px;
  transition: width 0.6s ease;
}

/* ---------- Toast ---------- */
.toast {
  pointer-events: auto;
  display: flex;
  align-items: flex-start;
  gap: 0.75rem;
  padding: 0.85rem 1rem;
  border-radius: 0.75rem;
  background: #0f172a;
  color: #f1f5f9;
  box-shadow: 0 10px 30px -10px rgba(0,0,0,0.4);
  border-left: 4px solid #34d399;
  animation: toastIn 0.3s ease-out;
}
.toast.error   { border-left-color: #f87171; }
.toast.warning { border-left-color: #fbbf24; }
.toast.info    { border-left-color: #60a5fa; }

@keyframes toastIn {
  from { transform: translateX(20px); opacity: 0; }
  to   { transform: translateX(0); opacity: 1; }
}

/* ---------- Inputs (touch-friendly) ---------- */
.ji-input {
  width: 100%;
  padding: 0.65rem 0.85rem;
  font-size: 0.95rem;
  border: 1px solid #cbd5e1;
  border-radius: 0.6rem;
  background: #fff;
  outline: none;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.ji-input:focus {
  border-color: #14b8a6;
  box-shadow: 0 0 0 3px rgba(20,184,166,0.18);
}
.ji-select { appearance: none; }

.ji-btn {
  display: inline-flex; align-items: center; justify-content: center;
  gap: 0.4rem;
  padding: 0.65rem 1rem;
  font-size: 0.9rem;
  font-weight: 600;
  border-radius: 0.6rem;
  transition: transform 0.05s, opacity 0.15s, background 0.15s;
  cursor: pointer;
}
.ji-btn:active { transform: translateY(1px); }
.ji-btn:disabled { opacity: 0.5; cursor: not-allowed; }

.ji-btn-primary { background: #0f172a; color: #fff; }
.ji-btn-primary:hover:not(:disabled) { background: #1e293b; }

.ji-btn-success { background: #059669; color: #fff; }
.ji-btn-success:hover:not(:disabled) { background: #047857; }

.ji-btn-warning { background: #d97706; color: #fff; }
.ji-btn-warning:hover:not(:disabled) { background: #b45309; }

.ji-btn-ghost {
  background: transparent;
  color: #0f172a;
  border: 1px solid #cbd5e1;
}
.ji-btn-ghost:hover:not(:disabled) { background: #f1f5f9; }

/* ---------- Card panel ---------- */
.ji-card {
  background: #ffffff;
  border-radius: 1rem;
  box-shadow: 0 4px 20px -8px rgba(15,23,42,0.12);
  border: 1px solid rgba(15,23,42,0.05);
}

/* ---------- Scrollbar polish (desktop) ---------- */
@media (min-width: 768px) {
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb {
    background: rgba(15,23,42,0.18);
    border-radius: 999px;
  }
  ::-webkit-scrollbar-thumb:hover { background: rgba(15,23,42,0.28); }
}

/* ---------- Tier badge ---------- */
.tier-badge {
  display: inline-flex; align-items: center;
  padding: 2px 10px;
  font-size: 0.65rem;
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  border-radius: 999px;
}
.tier-reguler   { background: rgba(255,255,255,0.18); color: #e2e8f0; }
.tier-platinum  { background: rgba(226,232,240,0.95); color: #0f172a; }
.tier-prioritas { background: linear-gradient(135deg,#fde047,#f59e0b); color: #422006; }

/* ---------- Number input: hide spinners ---------- */
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button {
  -webkit-appearance: none; margin: 0;
}
input[type=number] { -moz-appearance: textfield; }



/* ==========================================================================
   Phase 2 — Market, News, Physical Assets
   ========================================================================== */

/* ---------- Next Day button (highlight) ---------- */
#next-day-btn {
  background: linear-gradient(135deg, #34d399, #10b981);
  border: 1px solid rgba(255, 255, 255, 0.15);
  color: #052e2b;
  font-weight: 700;
  box-shadow: 0 4px 14px -4px rgba(16, 185, 129, 0.55);
}
#next-day-btn:hover:not(:disabled) {
  background: linear-gradient(135deg, #10b981, #059669);
  color: #ffffff;
}

/* ---------- Market table ---------- */
.tab-panel table {
  border-collapse: separate;
  border-spacing: 0;
}
.tab-panel thead th:first-child { border-top-left-radius: 0.75rem; }
.tab-panel thead th:last-child  { border-top-right-radius: 0.75rem; }
.tab-panel tbody tr:last-child td { border-bottom: 0; }
.tab-panel tbody tr:hover         { background: #f8fafc; }

/* Sticky header on long tables */
.tab-panel .ji-card thead th {
  position: sticky;
  top: 0;
  background: #f1f5f9;
  z-index: 1;
}

/* Trend arrows */
.trend-up   { color: #059669; }
.trend-down { color: #e11d48; }
.trend-flat { color: #64748b; }

/* ---------- News cards ---------- */
.tab-panel section,
.tab-panel article {
  word-break: break-word;
}

/* Subtle pulse for "today" news block to draw attention */
@keyframes newsPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0); }
  50%      { box-shadow: 0 0 0 6px rgba(52, 211, 153, 0.06); }
}
.news-today { animation: newsPulse 2.4s ease-in-out infinite; }

/* ---------- Asset cards (Aset Fisik) ---------- */
.asset-card {
  background: #ffffff;
  border: 1px solid #e2e8f0;
  border-radius: 1rem;
  padding: 1rem;
  transition: box-shadow 0.18s, transform 0.05s;
}
.asset-card:hover {
  box-shadow: 0 12px 28px -16px rgba(15, 23, 42, 0.25);
}
.asset-card:active { transform: translateY(1px); }

.asset-emoji {
  font-size: 2.5rem;
  line-height: 1;
  filter: drop-shadow(0 4px 8px rgba(0,0,0,0.1));
}

.brand-block {
  border: 1px solid rgba(15, 23, 42, 0.06);
  border-radius: 1rem;
  background: linear-gradient(180deg, #ffffff 0%, #fafbfc 100%);
}

/* Electric vehicle accent stripe */
.ev-accent {
  background: linear-gradient(135deg, rgba(16, 185, 129, 0.06), rgba(34, 211, 238, 0.06));
}

/* ---------- Modal polish ---------- */
#ji-modal {
  animation: modalIn 0.18s ease-out;
}
@keyframes modalIn {
  from { background: rgba(0,0,0,0); }
  to   { background: rgba(0,0,0,0.6); }
}
#ji-modal > div {
  animation: cardIn 0.22s ease-out;
}
@keyframes cardIn {
  from { transform: translateY(20px); opacity: 0; }
  to   { transform: translateY(0); opacity: 1; }
}

/* ---------- Mobile-first overrides ---------- */
@media (max-width: 640px) {
  .ji-card { border-radius: 0.85rem; }
  .desktop-tab { display: none; }
  /* Slightly tighter padding for stat cards on phones */
  .ji-card.p-5 { padding: 1rem; }
  /* Stack header date+button cleanly */
  #next-day-btn {
    padding: 0.45rem 0.75rem;
    font-size: 0.75rem;
  }
}

/* Compact spacing for market table on small/medium */
@media (max-width: 1023px) {
  .tab-panel table th,
  .tab-panel table td { padding: 0.6rem 0.75rem; }
}

/* ---------- Buy/Sell action buttons inside tables ---------- */
.row-action {
  padding: 0.35rem 0.75rem !important;
  font-size: 0.72rem !important;
  border-radius: 0.45rem !important;
}

/* ---------- News mood badges ---------- */
.mood-bullish { color: #059669; }
.mood-bearish { color: #e11d48; }
.mood-neutral { color: #64748b; }

/* ---------- Sparkline placeholder (Phase 3) ---------- */
.sparkline {
  height: 28px;
  width: 80px;
  background: linear-gradient(90deg, transparent, rgba(15,23,42,0.05));
  border-radius: 4px;
}



/* ==========================================================================
   Phase 3 — Game loop, level-up, HRD, CoreTax, single-file polish
   ========================================================================== */

/* ---------- Day-loop loading overlay ---------- */
#day-loading-overlay {
  animation: dayOverlayIn 0.18s ease-out;
}
@keyframes dayOverlayIn {
  from { opacity: 0; }
  to   { opacity: 1; }
}
.loading-spinner {
  width: 64px; height: 64px;
  border: 4px solid rgba(255,255,255,0.08);
  border-top-color: #34d399;
  border-radius: 50%;
  animation: spin 0.9s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- Tier pill on Home hero ---------- */
.tier-pill {
  background: linear-gradient(135deg, rgba(52, 211, 153, 0.18), rgba(20, 184, 166, 0.10));
  border: 1px solid rgba(52, 211, 153, 0.35);
  color: #ecfdf5;
  padding: 0.5rem 0.85rem;
  border-radius: 999px;
  backdrop-filter: blur(6px);
}

/* ---------- Level-up modal ---------- */
.levelup-card {
  background: linear-gradient(135deg, #0b1220 0%, #14532d 50%, #0b1220 100%);
  border: 2px solid rgba(52, 211, 153, 0.45);
  position: relative;
  overflow: hidden;
}
.levelup-card::before {
  content: '';
  position: absolute; inset: 0;
  background: radial-gradient(circle at 50% 0%, rgba(52, 211, 153, 0.30), transparent 60%);
  pointer-events: none;
}
.levelup-burst {
  display: inline-block;
  animation: burst 1.6s ease-out infinite;
  filter: drop-shadow(0 6px 14px rgba(52, 211, 153, 0.55));
}
@keyframes burst {
  0%, 100% { transform: scale(1) rotate(0deg); }
  35%      { transform: scale(1.2) rotate(-6deg); }
  70%      { transform: scale(0.95) rotate(4deg); }
}

/* ---------- HRD role / tier cards ---------- */
.hrd-tier-active {
  border-color: #34d399 !important;
  box-shadow: 0 0 0 3px rgba(52, 211, 153, 0.12);
}

/* ---------- CoreTax overdue rows ---------- */
.tax-overdue {
  background: linear-gradient(135deg, #fff7ed, #fef2f2);
  border-color: #fdba74;
}
.tax-penalty-active {
  background: linear-gradient(135deg, #fee2e2, #fecaca);
  border-color: #fca5a5;
}

/* ---------- Reset Game button — emphasized warning style ---------- */
.ji-btn.danger {
  background: #e11d48;
  color: #fff;
}
.ji-btn.danger:hover:not(:disabled) {
  background: #be123c;
}

/* ---------- Prediction badge on Market tickers ---------- */
.predict-badge {
  display: inline-flex;
  align-items: center;
  gap: 0.15rem;
  padding: 0.15rem 0.4rem;
  font-size: 0.62rem;
  font-weight: 700;
  border-radius: 0.35rem;
  margin-left: 0.4rem;
}
.predict-up   { background: rgba(16, 185, 129, 0.12); color: #047857; }
.predict-down { background: rgba(244, 63, 94, 0.12);  color: #be123c; }

/* ---------- Mobile tweaks ---------- */
@media (max-width: 640px) {
  .levelup-card { padding: 1.5rem; }
  #day-loading-overlay .loading-spinner {
    width: 52px; height: 52px;
  }
  .tier-pill { font-size: 0.75rem; padding: 0.4rem 0.65rem; }
}

</style>
</head>

<!-- =========================================================================
     Juragan Investasi: Capitalist Tycoon — single-file build
     Phase 1 + Phase 2 + Phase 3 combined.
     Source modules (kept in /js for development) inlined below in dep order:
       js/utils.js
       js/state.js
       js/banking.js
       js/market.js
       js/news.js
       js/assets.js
       js/tax.js
       js/hrd.js
       js/ui.js
       js/app.js
     ========================================================================= -->
<script>
/* === js/utils.js === */
/* =========================================================================
   utils.js — formatting, calendar, DOM, toasts
   Exposed on window.JI namespace.
   ========================================================================= */

(function (global) {
  'use strict';

  const JI = global.JI || (global.JI = {});

  /* ---------- Currency ---------- */
  const idrFormatter = new Intl.NumberFormat('id-ID', {
    style: 'currency',
    currency: 'IDR',
    minimumFractionDigits: 0,
    maximumFractionDigits: 0,
  });

  const idrCompactFormatter = new Intl.NumberFormat('id-ID', {
    notation: 'compact',
    maximumFractionDigits: 1,
  });

  function formatIDR(amount) {
    const n = Number(amount) || 0;
    return idrFormatter.format(Math.round(n));
  }

  function formatIDRCompact(amount) {
    const n = Number(amount) || 0;
    return 'Rp ' + idrCompactFormatter.format(Math.round(n));
  }

  function parseIDRInput(str) {
    if (typeof str === 'number') return str;
    if (!str) return 0;
    const cleaned = String(str).replace(/[^\d]/g, '');
    return parseInt(cleaned, 10) || 0;
  }

  /* ---------- Custom Calendar -----------
     Rule: 30 days = 1 month, 12 months = 1 year.
     totalDays starts at 1 = "Hari 1, Bulan 1, Y1".
  */
  function getCalendar(totalDays) {
    const t = Math.max(1, Math.floor(totalDays || 1));
    const zero = t - 1;                    // 0-based
    const day   = (zero % 30) + 1;         // 1..30
    const month = (Math.floor(zero / 30) % 12) + 1; // 1..12
    const year  = Math.floor(zero / 360) + 1;       // Y1, Y2, ...
    return { day, month, year, totalDays: t };
  }

  function formatCalendar(totalDays) {
    const c = getCalendar(totalDays);
    return `Hari ${c.day}, Bulan ${c.month}, Y${c.year}`;
  }

  /* ---------- Random ---------- */
  function randomInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  /**
   * Split `total` into n positive parts, each part >= minPart, with all parts distinct.
   */
  function splitUnequal(total, n, minPart = 1) {
    if (n <= 0) return [];
    if (n === 1) return [total];

    // Generate n distinct random weights, then normalize.
    let weights;
    let attempts = 0;
    do {
      weights = Array.from({ length: n }, () => Math.random() + 0.2);
      attempts++;
    } while (hasDuplicateWeights(weights) && attempts < 5);

    const sumW = weights.reduce((a, b) => a + b, 0);
    let parts = weights.map(w => Math.floor((w / sumW) * total));

    // Ensure minimum
    parts = parts.map(p => Math.max(p, minPart));

    // Adjust last to make sum exactly equal to total
    const diff = total - parts.reduce((a, b) => a + b, 0);
    parts[parts.length - 1] += diff;

    // Force distinctness by nudging duplicates
    for (let i = 0; i < parts.length; i++) {
      for (let j = i + 1; j < parts.length; j++) {
        if (parts[i] === parts[j]) {
          parts[i] += 1;
          parts[j] -= 1;
        }
      }
    }
    return parts;
  }

  function hasDuplicateWeights(arr) {
    const s = new Set(arr.map(x => x.toFixed(3)));
    return s.size !== arr.length;
  }

  /* ---------- DOM helpers ---------- */
  function $(sel, root = document) { return root.querySelector(sel); }
  function $(sel, root = document) { return Array.from(root.querySelectorAll(sel)); }

  function el(tag, attrs = {}, children = []) {
    const node = document.createElement(tag);
    Object.entries(attrs || {}).forEach(([k, v]) => {
      if (v === false || v == null) return;
      if (k === 'class') node.className = v;
      else if (k === 'html') node.innerHTML = v;
      else if (k.startsWith('on') && typeof v === 'function') {
        node.addEventListener(k.slice(2).toLowerCase(), v);
      } else if (k === 'dataset' && typeof v === 'object') {
        Object.entries(v).forEach(([dk, dv]) => (node.dataset[dk] = dv));
      } else {
        node.setAttribute(k, v);
      }
    });
    (Array.isArray(children) ? children : [children]).forEach(c => {
      if (c == null || c === false) return;
      node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    });
    return node;
  }

  /* ---------- Toast notifications ---------- */
  function toast(message, type = 'success', timeoutMs = 2800) {
    const container = document.getElementById('toast-container');
    if (!container) return;

    const t = el('div', { class: `toast ${type === 'success' ? '' : type}` });
    const icon = el('span', { class: 'text-lg leading-none' });
    icon.textContent = (
      { success: '✓', error: '✕', warning: '!', info: 'i' }[type] || '✓'
    );
    const text = el('div', { class: 'flex-1 text-sm leading-snug' });
    text.textContent = message;
    t.appendChild(icon);
    t.appendChild(text);
    container.appendChild(t);

    setTimeout(() => {
      t.style.transition = 'opacity .3s, transform .3s';
      t.style.opacity = '0';
      t.style.transform = 'translateX(20px)';
      setTimeout(() => t.remove(), 300);
    }, timeoutMs);
  }

  /* ---------- Clamp ---------- */
  function clamp(n, min, max) {
    return Math.max(min, Math.min(max, n));
  }

  /* ---------- Expose ---------- */
  Object.assign(JI, {
    formatIDR,
    formatIDRCompact,
    parseIDRInput,
    getCalendar,
    formatCalendar,
    randomInt,
    splitUnequal,
    $, $, el,
    toast,
    clamp,
  });
})(window);

</script>

<script>
/* === js/state.js === */
/* =========================================================================
   state.js — Central gameState + persistence + level system.
   ========================================================================= */

(function (global) {
  'use strict';

  const JI = global.JI || (global.JI = {});

  const STORAGE_KEY = 'juragan_investasi_state_v1';
  const STATE_VERSION = 3; // Phase 3
  const STARTING_CAPITAL = 150_000_000; // Rp 150jt
  const DAILY_OPS_COST  = 150_000;      // Rp 150rb / day

  /* ---------- Company titles by level (Phase 3 spec) ----------
     Level 1-3   : Retail Trader
     Level 4-6   : Boutique Firm
     Level 7-9   : Hedge Fund
     Level 10+   : Conglomerate Tycoon
  */
  const TITLE_TIERS = [
    { min: 1,  max: 3,        title: 'Retail Trader',      icon: '👤' },
    { min: 4,  max: 6,        title: 'Boutique Firm',      icon: '🏢' },
    { min: 7,  max: 9,        title: 'Hedge Fund',         icon: '💎' },
    { min: 10, max: Infinity, title: 'Conglomerate Tycoon',icon: '👑' },
  ];

  /* Kept for backward compatibility — populated as a flat list. */
  const COMPANY_TITLES = [
    'Retail Trader','Retail Trader','Retail Trader',
    'Boutique Firm','Boutique Firm','Boutique Firm',
    'Hedge Fund','Hedge Fund','Hedge Fund',
    'Conglomerate Tycoon',
  ];

  /* XP curve per Phase 3 spec: companyXP >= companyLevel * 1000. */
  function xpToNext(level) {
    return Math.max(1, Math.floor(level)) * 1000;
  }

  function getCompanyTitle(level) {
    const tier = TITLE_TIERS.find(t => level >= t.min && level <= t.max)
              || TITLE_TIERS[TITLE_TIERS.length - 1];
    return tier.title;
  }

  function getCompanyTitleTier(level) {
    return TITLE_TIERS.find(t => level >= t.min && level <= t.max)
        || TITLE_TIERS[TITLE_TIERS.length - 1];
  }

  /* ---------- Default state factory ---------- */
  function defaultState() {
    return {
      version: STATE_VERSION,
      totalDays: 1,
      totalNetWorth: STARTING_CAPITAL,

      // Banks created by banking.js init when state is fresh.
      banks: [],

      // Market — current per-asset prices keyed by ticker.
      // Populated by market.js initMarket().
      marketAssets: {},          // { BBCA: { price, prevPrice, change, ... }, ... }
      marketHistory: {},         // { BBCA: [p1, p2, ...] (last N) }

      // Portfolio holdings.
      portfolio: [],             // [{ticker, category, qty, avgPrice, totalCost}]

      // News
      newsHistory: [],           // [{day, headline, body, targets}]
      dailyNews: [],             // current day's news (subset of newsHistory)
      lastNewsDay: 0,

      // Tax (Phase 3)
      taxLiabilities: [],        // [{id, type, baseAmount, owedAmount, dueDay, paid, paidDay, createdDay}]
      taxStats: {
        totalPPhPaid: 0,
        totalAnnualPaid: 0,
        totalPenaltiesPaid: 0,
      },

      // HRD (Phase 3)
      hiredEmployees: [],        // [{id, role, tier, salary, hiredOn}]

      // Physical assets
      physicalAssets: {
        properties:    [],       // [{instanceId, key, name, capacity, value, purchaseDay}]
        cars:          [],
        motorcycles:   [],
        officeCapacity: 0,
      },

      // Company progression
      companyLevel: 1,
      companyXP: 0,

      // Lifetime broker / market metrics (Phase 3)
      brokerStats: {
        totalFeesPaid: 0,
        totalCashbackEarned: 0,
        totalRealizedPnL: 0,
        profitableSells: 0,
        losingSells: 0,
      },

      // Bookkeeping for the day-loop
      lastMonthProcessed: 0,     // last "month index" for which monthly ops ran

      // UI
      activeTab: 'home',
      meta: {
        createdAt: Date.now(),
      },
    };
  }

  /* ---------- Persistence ---------- */
  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return null;
      return JSON.parse(raw);
    } catch (e) {
      console.warn('Failed to load state:', e);
      return null;
    }
  }

  function saveState(state) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) {
      console.warn('Failed to save state:', e);
    }
  }

  function resetState() {
    localStorage.removeItem(STORAGE_KEY);
  }

  /* ---------- Net worth recompute ----------
     Phase 2 scope:
       liquid     = bank balances
       portfolio  = sum(qty * currentMarketPrice)
       physical   = sum(value of properties + cars + motorcycles)
       debts      = active loan remaining + credit-card used
     netWorth    = liquid + portfolio + physical − debts
  */
  function recomputeNetWorth(state) {
    const banks = state.banks || [];
    const bankSum = banks.reduce((a, b) => a + (b.balance || 0), 0);
    const loanDebt = banks.reduce(
      (a, b) => a + (b.loan && b.loan.isActive ? b.loan.remaining : 0), 0);
    const ccDebt = banks.reduce(
      (a, b) => a + (b.creditCard ? b.creditCard.used || 0 : 0), 0);

    const portfolio = state.portfolio || [];
    const market = state.marketAssets || {};
    const portfolioValue = portfolio.reduce((sum, h) => {
      const m = market[h.ticker];
      const price = m ? m.price : (h.avgPrice || 0);
      return sum + price * h.qty;
    }, 0);

    const phys = state.physicalAssets || {};
    const sumValue = arr => (arr || []).reduce((a, x) => a + (x.value || 0), 0);
    const physicalValue =
      sumValue(phys.properties) + sumValue(phys.cars) + sumValue(phys.motorcycles);

    state.totalNetWorth = bankSum + portfolioValue + physicalValue - loanDebt - ccDebt;
    return state.totalNetWorth;
  }

  /* ---------- XP / Level (Phase 3 spec) ----------
     Threshold: companyLevel * 1000.
     Returns: { leveledUp, levelsGained, newLevel, newTitle }
  */
  function awardXP(state, amount) {
    state.companyXP += Math.max(0, Math.floor(amount));
    let levelsGained = 0;
    while (state.companyXP >= xpToNext(state.companyLevel)) {
      state.companyXP -= xpToNext(state.companyLevel);
      state.companyLevel += 1;
      levelsGained += 1;
      if (state.companyLevel > 99) break; // safety
    }
    return {
      leveledUp: levelsGained > 0,
      levelsGained,
      newLevel: state.companyLevel,
      newTitle: getCompanyTitle(state.companyLevel),
    };
  }

  /* ---------- Migration ---------- */
  function migrateState(state) {
    if (!state || typeof state !== 'object') return defaultState();

    // Add missing top-level fields without wiping existing data.
    const def = defaultState();
    Object.keys(def).forEach(k => {
      if (state[k] === undefined) state[k] = def[k];
    });

    // physicalAssets shape
    state.physicalAssets = state.physicalAssets || def.physicalAssets;
    ['properties', 'cars', 'motorcycles'].forEach(k => {
      if (!Array.isArray(state.physicalAssets[k])) state.physicalAssets[k] = [];
    });
    if (typeof state.physicalAssets.officeCapacity !== 'number') {
      state.physicalAssets.officeCapacity = 0;
    }

    state.marketAssets   = state.marketAssets   || {};
    state.marketHistory  = state.marketHistory  || {};
    state.portfolio      = state.portfolio      || [];
    state.newsHistory    = state.newsHistory    || [];
    state.dailyNews      = state.dailyNews      || [];
    if (typeof state.lastNewsDay !== 'number') state.lastNewsDay = 0;

    // Phase 3 fields
    state.taxLiabilities = state.taxLiabilities || [];
    state.taxStats       = state.taxStats       || def.taxStats;
    state.hiredEmployees = state.hiredEmployees || [];
    state.brokerStats    = state.brokerStats    || def.brokerStats;
    if (typeof state.lastMonthProcessed !== 'number') state.lastMonthProcessed = 0;

    state.version = STATE_VERSION;
    return state;
  }

  /* ---------- Bootstrap ---------- */
  function initState() {
    let state = loadState();
    if (!state) {
      state = defaultState();
    } else {
      state = migrateState(state);
    }
    JI.gameState = state;
    return state;
  }

  /* ---------- Expose ---------- */
  Object.assign(JI, {
    STARTING_CAPITAL,
    DAILY_OPS_COST,
    STATE_VERSION,
    COMPANY_TITLES,
    TITLE_TIERS,
    xpToNext,
    getCompanyTitle,
    getCompanyTitleTier,
    defaultState,
    loadState,
    saveState,
    resetState,
    recomputeNetWorth,
    awardXP,
    initState,
    migrateState,
  });
})(window);

</script>

<script>
/* === js/banking.js === */
/* =========================================================================
   banking.js — Bank engine: 3 banks, transfer, credit card, KTA loan.
   ========================================================================= */

(function (global) {
  'use strict';

  const JI = global.JI || (global.JI = {});

  /* ---------- Bank static config ---------- */
  const BANK_DEFS = [
    {
      id: 'mandiri',
      name: 'Bank Mandiri',
      shortName: 'Mandiri',
      themeClass: 'bank-card-mandiri',
      colors: { primary: '#003D79', accent: '#FFD700' },
      tagline: 'Terdepan, Terpercaya, Tumbuh bersama Anda',
    },
    {
      id: 'bca',
      name: 'Bank Central Asia',
      shortName: 'BCA',
      themeClass: 'bank-card-bca',
      colors: { primary: '#0060AF', accent: '#FFFFFF' },
      tagline: 'Senantiasa di Sisi Anda',
    },
    {
      id: 'bni',
      name: 'Bank Negara Indonesia',
      shortName: 'BNI',
      themeClass: 'bank-card-bni',
      colors: { primary: '#006A6E', accent: '#F26722' },
      tagline: 'Melayani Negeri, Kebanggaan Bangsa',
    },
  ];

  /* ---------- Tier rules ---------- */
  const TIER_PLATINUM_MIN  = 50_000_000;
  const TIER_PRIORITAS_MIN = 250_000_000;

  function debitTierFor(balance) {
    if (balance > TIER_PRIORITAS_MIN)  return 'Prioritas';
    if (balance >= TIER_PLATINUM_MIN)  return 'Platinum';
    return 'Reguler';
  }

  function tierBadgeClass(tier) {
    return ({
      'Reguler':   'tier-reguler',
      'Platinum':  'tier-platinum',
      'Prioritas': 'tier-prioritas',
    })[tier] || 'tier-reguler';
  }

  /* ---------- Credit card rules ----------
     Approval & limit are based on current bank balance.
     Limit = 50% of balance, capped at Rp 100,000,000.
     Minimum balance to qualify: Rp 5,000,000.
  */
  const CC_MIN_BALANCE = 5_000_000;
  const CC_MAX_LIMIT   = 100_000_000;

  function creditCardOffer(balance) {
    if (balance < CC_MIN_BALANCE) {
      return { eligible: false, limit: 0, reason: 'Saldo minimum Rp 5.000.000 untuk pengajuan kartu kredit.' };
    }
    const limit = Math.min(Math.floor(balance * 0.5), CC_MAX_LIMIT);
    return { eligible: true, limit };
  }

  /* ---------- Loan (KTA) rules ----------
     Max principal = 2 x current balance.
     Flat interest 5% over a 30-day term.
     totalRepay = principal * 1.05; daily = totalRepay / 30.
  */
  const LOAN_INTEREST_FLAT = 0.05;
  const LOAN_TERM_DAYS = 30;

  function maxLoanPrincipal(balance) {
    return Math.max(0, Math.floor(balance * 2));
  }

  function quoteLoan(principal) {
    const p = Math.max(0, Math.floor(principal || 0));
    const totalRepay = Math.round(p * (1 + LOAN_INTEREST_FLAT));
    const dailyInstallment = Math.round(totalRepay / LOAN_TERM_DAYS);
    return {
      principal: p,
      totalRepay,
      dailyInstallment,
      termDays: LOAN_TERM_DAYS,
      interestFlat: LOAN_INTEREST_FLAT,
    };
  }

  /* ---------- Bank factory ---------- */
  function makeBank(def, balance) {
    return {
      id: def.id,
      name: def.name,
      shortName: def.shortName,
      themeClass: def.themeClass,
      colors: def.colors,
      tagline: def.tagline,
      balance: balance,
      debitTier: debitTierFor(balance),
      creditCard: {
        isApproved: false,
        limit: 0,
        used: 0,
      },
      loan: {
        isActive: false,
        principal: 0,
        remaining: 0,
        dailyInstallment: 0,
        daysRemaining: 0,
        startedOnDay: 0,
      },
    };
  }

  /* ---------- Initialize banks on a fresh state ---------- */
  function initBanks(state) {
    if (!state) return;
    if (state.banks && state.banks.length === BANK_DEFS.length) {
      // Already initialized — just refresh tiers in case rules changed.
      state.banks.forEach(b => (b.debitTier = debitTierFor(b.balance)));
      return;
    }

    const total = JI.STARTING_CAPITAL;
    const parts = JI.splitUnequal(total, BANK_DEFS.length, 5_000_000);
    state.banks = BANK_DEFS.map((def, i) => makeBank(def, parts[i]));
  }

  /* ---------- Lookup ---------- */
  function getBank(state, id) {
    return (state.banks || []).find(b => b.id === id);
  }

  /* ---------- Refresh derived fields after balance changes ---------- */
  function refreshDerived(bank) {
    bank.debitTier = debitTierFor(bank.balance);
  }

  /* =========================================================================
     UNIVERSAL CHARGE — used by market buys, asset purchases, etc.
     payment = { method: 'bank' | 'credit', bankId: 'mandiri'|'bca'|'bni' }
     - 'bank'   : deduct from chosen bank balance
     - 'credit' : add to credit card 'used' if within available limit
     ========================================================================= */
  function charge(state, amount, payment) {
    const amt = Math.floor(Number(amount) || 0);
    if (amt <= 0) return { ok: false, error: 'Nominal tidak valid.' };
    if (!payment || !payment.method) {
      return { ok: false, error: 'Metode pembayaran wajib dipilih.' };
    }
    const bank = getBank(state, payment.bankId);
    if (!bank) return { ok: false, error: 'Bank tidak ditemukan.' };

    if (payment.method === 'bank') {
      if (bank.balance < amt) {
        return { ok: false,
          error: `Saldo ${bank.shortName} tidak cukup (butuh ${JI.formatIDR(amt)}).` };
      }
      bank.balance -= amt;
      refreshDerived(bank);
      return { ok: true, method: 'bank', bankId: bank.id, amount: amt };
    }

    if (payment.method === 'credit') {
      if (!bank.creditCard.isApproved) {
        return { ok: false,
          error: `Kartu kredit ${bank.shortName} belum aktif.` };
      }
      const available = bank.creditCard.limit - bank.creditCard.used;
      if (available < amt) {
        return { ok: false,
          error: `Limit kartu kredit ${bank.shortName} tidak cukup (sisa ${JI.formatIDR(available)}).` };
      }
      bank.creditCard.used += amt;
      return { ok: true, method: 'credit', bankId: bank.id, amount: amt };
    }

    return { ok: false, error: 'Metode pembayaran tidak dikenali.' };
  }

  /* ---------- Refund (e.g. unused tax payments) ---------- */
  function deposit(state, bankId, amount) {
    const amt = Math.floor(Number(amount) || 0);
    const bank = getBank(state, bankId);
    if (!bank || amt <= 0) return { ok: false };
    bank.balance += amt;
    refreshDerived(bank);
    return { ok: true };
  }

  /* =========================================================================
     CREDIT CARD repayment from a bank balance.
     ========================================================================= */
  function repayCreditCard(state, bankId, amount) {
    const bank = getBank(state, bankId);
    if (!bank) return { ok: false, error: 'Bank tidak ditemukan.' };
    if (!bank.creditCard.isApproved) {
      return { ok: false, error: 'Kartu kredit belum aktif.' };
    }
    let amt = Math.floor(Number(amount) || 0);
    if (amt <= 0) return { ok: false, error: 'Nominal tidak valid.' };
    if (amt > bank.creditCard.used) amt = bank.creditCard.used;
    if (bank.balance < amt) {
      return { ok: false, error: `Saldo ${bank.shortName} tidak cukup.` };
    }
    bank.balance -= amt;
    bank.creditCard.used -= amt;
    refreshDerived(bank);
    JI.recomputeNetWorth(state);
    return { ok: true, paid: amt };
  }

  /* =========================================================================
     DAILY LOAN TICKER — called once per day-advance.
     For each active loan, deduct dailyInstallment from the same bank's balance.
     If insufficient: try to pull from credit card limit; otherwise mark missed.
     When term completes (daysRemaining == 0 and remaining ~0), close loan.
     ========================================================================= */
  function tickDailyLoans(state) {
    const events = [];
    (state.banks || []).forEach(bank => {
      if (!bank.loan || !bank.loan.isActive) return;
      const installment = Math.min(bank.loan.dailyInstallment, bank.loan.remaining);

      if (bank.balance >= installment) {
        bank.balance -= installment;
        bank.loan.remaining -= installment;
        events.push({
          bankId: bank.id,
          paid: installment,
          source: 'bank',
        });
      } else if (bank.creditCard.isApproved &&
                 (bank.creditCard.limit - bank.creditCard.used) >= installment) {
        // Auto-fallback to credit card
        bank.creditCard.used += installment;
        bank.loan.remaining -= installment;
        events.push({
          bankId: bank.id,
          paid: installment,
          source: 'credit',
          warning: true,
        });
      } else {
        // Missed payment — apply small penalty to remaining balance
        const penalty = Math.round(installment * 0.02);
        bank.loan.remaining += penalty;
        events.push({
          bankId: bank.id,
          paid: 0,
          missed: true,
          penalty,
        });
      }

      bank.loan.daysRemaining = Math.max(0, bank.loan.daysRemaining - 1);
      if (bank.loan.remaining <= 0 || bank.loan.daysRemaining === 0) {
        // Close loan if fully paid; otherwise allow remainder to roll-up next tick.
        if (bank.loan.remaining <= 0) {
          bank.loan = {
            isActive: false,
            principal: 0, remaining: 0,
            dailyInstallment: 0, daysRemaining: 0,
            startedOnDay: 0,
          };
          events.push({ bankId: bank.id, closed: true });
        }
      }
      refreshDerived(bank);
    });
    return events;
  }

  /* ---------- Operation: Transfer between own bank accounts ---------- */
  function transfer(state, fromId, toId, amount) {
    if (fromId === toId) {
      return { ok: false, error: 'Bank asal dan tujuan tidak boleh sama.' };
    }
    const amt = Math.floor(Number(amount) || 0);
    if (amt <= 0) {
      return { ok: false, error: 'Nominal harus lebih besar dari 0.' };
    }
    const from = getBank(state, fromId);
    const to   = getBank(state, toId);
    if (!from || !to) return { ok: false, error: 'Bank tidak ditemukan.' };
    if (from.balance < amt) {
      return { ok: false, error: `Saldo ${from.shortName} tidak mencukupi.` };
    }
    from.balance -= amt;
    to.balance   += amt;
    refreshDerived(from);
    refreshDerived(to);
    JI.recomputeNetWorth(state);
    JI.awardXP(state, Math.min(50, Math.floor(amt / 1_000_000)));
    return { ok: true, amount: amt };
  }

  /* ---------- Operation: Credit card application ---------- */
  function applyCreditCard(state, bankId) {
    const bank = getBank(state, bankId);
    if (!bank) return { ok: false, error: 'Bank tidak ditemukan.' };
    if (bank.creditCard.isApproved) {
      return { ok: false, error: 'Kartu kredit sudah aktif.' };
    }
    const offer = creditCardOffer(bank.balance);
    if (!offer.eligible) {
      return { ok: false, error: offer.reason };
    }
    bank.creditCard.isApproved = true;
    bank.creditCard.limit = offer.limit;
    bank.creditCard.used = 0;
    JI.awardXP(state, 80);
    return { ok: true, limit: offer.limit };
  }

  /* ---------- Operation: Apply KTA loan ---------- */
  function applyLoan(state, bankId, principal) {
    const bank = getBank(state, bankId);
    if (!bank) return { ok: false, error: 'Bank tidak ditemukan.' };
    if (bank.loan.isActive) {
      return { ok: false, error: 'Pinjaman lain masih aktif di bank ini.' };
    }
    const p = Math.floor(Number(principal) || 0);
    if (p <= 0) {
      return { ok: false, error: 'Nominal pinjaman tidak valid.' };
    }
    const max = maxLoanPrincipal(bank.balance);
    if (p > max) {
      return { ok: false, error: `Maksimum pinjaman di ${bank.shortName} adalah ${JI.formatIDR(max)}.` };
    }
    const q = quoteLoan(p);

    bank.loan = {
      isActive: true,
      principal: q.principal,
      remaining: q.totalRepay,
      dailyInstallment: q.dailyInstallment,
      daysRemaining: q.termDays,
      startedOnDay: state.totalDays,
    };
    bank.balance += p; // disbursement
    refreshDerived(bank);
    JI.recomputeNetWorth(state);
    JI.awardXP(state, 120);
    return { ok: true, quote: q };
  }

  /* ---------- Helpers used by UI / future phases ---------- */
  function totalBankBalance(state) {
    return (state.banks || []).reduce((a, b) => a + (b.balance || 0), 0);
  }

  function totalCreditCardDebt(state) {
    return (state.banks || []).reduce((a, b) =>
      a + (b.creditCard && b.creditCard.used ? b.creditCard.used : 0), 0);
  }

  function totalAvailableCredit(state) {
    return (state.banks || []).reduce((a, b) => {
      if (!b.creditCard || !b.creditCard.isApproved) return a;
      return a + (b.creditCard.limit - b.creditCard.used);
    }, 0);
  }

  function activeLoanCount(state) {
    return (state.banks || []).filter(b => b.loan && b.loan.isActive).length;
  }

  /* =========================================================================
     deductFromBest(state, amount, label)
     Pay an arbitrary expense (ops cost, salary, tax, etc.) using the best
     available source. Order:
       1. Largest single bank balance >= amount → debit it.
       2. Drain banks in descending balance order until covered.
       3. Fall back to credit card with most available limit.
       4. Otherwise mark as missed (returns ok:false with shortfall).
     Returns: { ok, sources: [{kind, bankId, amount}], shortfall }
     ========================================================================= */
  function deductFromBest(state, amount, label = 'expense') {
    let need = Math.max(0, Math.floor(Number(amount) || 0));
    if (need === 0) return { ok: true, sources: [], shortfall: 0, label };

    const sources = [];
    // Step 1+2: drain banks
    const banks = (state.banks || [])
      .slice()
      .sort((a, b) => b.balance - a.balance);
    for (const bank of banks) {
      if (need <= 0) break;
      if (bank.balance <= 0) continue;
      const take = Math.min(bank.balance, need);
      bank.balance -= take;
      refreshDerived(bank);
      sources.push({ kind: 'bank', bankId: bank.id, amount: take });
      need -= take;
    }
    // Step 3: fall back to credit cards (largest available limit first)
    if (need > 0) {
      const ccs = (state.banks || [])
        .filter(b => b.creditCard && b.creditCard.isApproved)
        .map(b => ({ bank: b, available: b.creditCard.limit - b.creditCard.used }))
        .filter(x => x.available > 0)
        .sort((a, b) => b.available - a.available);
      for (const { bank, available } of ccs) {
        if (need <= 0) break;
        const take = Math.min(available, need);
        bank.creditCard.used += take;
        sources.push({ kind: 'credit', bankId: bank.id, amount: take });
        need -= take;
      }
    }
    JI.recomputeNetWorth(state);
    return {
      ok: need === 0,
      sources,
      shortfall: need,
      label,
    };
  }

  /* =========================================================================
     enforceMonthlyCCCharges(state)
     Called once per month (every 30 days). Applies a 5% finance charge to
     any outstanding credit-card balance, simulating Indonesian CC monthly
     interest. Returns events: [{bankId, charge}].
     ========================================================================= */
  const CC_MONTHLY_INTEREST = 0.05;

  function enforceMonthlyCCCharges(state) {
    const events = [];
    (state.banks || []).forEach(bank => {
      if (!bank.creditCard || !bank.creditCard.isApproved) return;
      const used = bank.creditCard.used || 0;
      if (used <= 0) return;
      const charge = Math.round(used * CC_MONTHLY_INTEREST);
      // Cap so used never exceeds the limit; if it would, only fill to limit.
      const newUsed = Math.min(bank.creditCard.limit, used + charge);
      const applied = newUsed - used;
      bank.creditCard.used = newUsed;
      events.push({ bankId: bank.id, charge: applied, requested: charge });
    });
    JI.recomputeNetWorth(state);
    return events;
  }

  /* ---------- Expose ---------- */
  Object.assign(JI, {
    BANK_DEFS,
    debitTierFor,
    tierBadgeClass,
    creditCardOffer,
    quoteLoan,
    maxLoanPrincipal,
    initBanks,
    getBank,
    transfer,
    applyCreditCard,
    applyLoan,
    totalBankBalance,
    activeLoanCount,
    totalCreditCardDebt,
    totalAvailableCredit,
    LOAN_INTEREST_FLAT,
    LOAN_TERM_DAYS,
    CC_MAX_LIMIT,
    CC_MONTHLY_INTEREST,
    // Phase 2 additions
    charge,
    deposit,
    repayCreditCard,
    tickDailyLoans,
    refreshBankDerived: refreshDerived,
    // Phase 3 additions
    deductFromBest,
    enforceMonthlyCCCharges,
  });
})(window);

</script>

    },
    reksadana: {

      icon: '📑',
      maxSwing: 0.005,   // ±0.5% per day
      drift: 0.0004,
      assets: REKSADANA,
    },
  };

  /* ---------- Reverse index: ticker -> category ---------- */
  const TICKER_INDEX = {};
  Object.values(CATEGORY).forEach(cat => {
    cat.assets.forEach(a => {
      TICKER_INDEX[a.ticker] = { category: cat.key, def: a };
    });
  });

  function getAssetDef(ticker) {

  }

  function allAssets() {
    return [
      ...STOCKS.map(a => ({ ...a, category: 'saham' })),
      ...CRYPTOS.map(a => ({ ...a, category: 'crypto' })),
      ...REKSADANA.map(a => ({ ...a, category: 'reksadana' })),
    ];
  }

  /* =========================================================================
     Initialize market on a fresh state
     ========================================================================= */
  const HISTORY_LENGTH = 30;

  function initMarket(state) {
    if (!state) return;
    state.marketAssets = state.marketAssets || {};
    state.marketHistory = state.marketHistory || {};

    allAssets().forEach(a => {
      if (!state.marketAssets[a.ticker]) {
        state.marketAssets[a.ticker] = {
          ticker: a.ticker,
          name: a.name,
          category: a.category,
          price: a.price,
          openPrice: a.price,
          prevPrice: a.price,
          dayChange: 0,
          dayChangePct: 0,
        };
      }
      if (!state.marketHistory[a.ticker]) {
        state.marketHistory[a.ticker] = [a.price];
      }
    });
  }

  /* =========================================================================
     Random Walk with Drift
     newPrice = oldPrice * (1 + drift + uniform(-vol, +vol)) * newsMultiplier
     Then clamped to ±maxSwing of the category.
     ========================================================================= */
  function _stepPrice(oldPrice, def, categoryMeta, newsImpact, analystBonus = 0) {
    const noise = (Math.random() * 2 - 1) * def.vol; // baseline volatility
    // News pushes change toward the category's hard swing limit.
    const newsBoost = newsImpact * (categoryMeta.maxSwing - def.vol * 0.5);

    let change = categoryMeta.drift + analystBonus + noise + newsBoost;
    if (change >  categoryMeta.maxSwing) change =  categoryMeta.maxSwing;
    if (change < -categoryMeta.maxSwing) change = -categoryMeta.maxSwing;

    let next = oldPrice * (1 + change);

    // Floors per category to keep things sensible.
    const floor =
      categoryMeta.key === 'saham'     ? 50 :
      categoryMeta.key === 'crypto'    ? 100 :
      categoryMeta.key === 'reksadana' ? 100 : 1;
    if (next < floor) next = floor;

    next = Math.round(next);
    return { next, change };
  }

  /**
   * calculateNextDayPrices(state, newsImpactByTicker)
   * Advances all 45 assets by one day using Random Walk with Drift.
   * `newsImpactByTicker` is a Map/object: ticker -> impact in [-1..+1].
   * Veteran analyst (HRD tier 3) adds a +0.2% positive drift bonus.
   */
  function calculateNextDayPrices(state, newsImpactByTicker = {}) {
    if (!state.marketAssets) initMarket(state);

    // Apply analyst veteran drift bonus (Phase 3 perk)
    let analystBonus = 0;
    if (JI.getActivePerks) {
      const perks = JI.getActivePerks(state);
      if (perks && perks.analyst && perks.analyst.tier === 3) {
        analystBonus = 0.002; // +0.2% / day positive drift
      }
    }

    Object.values(CATEGORY).forEach(catMeta => {
      catMeta.assets.forEach(def => {
        const m = state.marketAssets[def.ticker];
        if (!m) return;
        const impact = clamp(
          (newsImpactByTicker[def.ticker] || 0) +
          (newsImpactByTicker[`cat:${catMeta.key}`] || 0) +
          (newsImpactByTicker['cat:all'] || 0),
          -1, 1
        );
        const { next } = _stepPrice(m.price, def, catMeta, impact, analystBonus);

        m.prevPrice = m.price;
        m.openPrice = m.price; // open of new day = close of previous
        m.price = next;
        m.dayChange = next - m.prevPrice;
        m.dayChangePct = m.prevPrice > 0
          ? (m.dayChange / m.prevPrice) * 100
          : 0;

        // History
        const h = state.marketHistory[def.ticker] || (state.marketHistory[def.ticker] = []);
        h.push(next);
        if (h.length > HISTORY_LENGTH) h.shift();
      });
    });
  }

  /* =========================================================================
     Predict next-day market impacts based on today's news.
     Used by the HRD Analis Keuangan perk (Junior=1, Senior=3, Veteran=5).
     Returns predictions sorted by |totalImpact| descending.
     ========================================================================= */
  function predictMarketImpacts(state, count) {
    const news = state.dailyNews || [];
    if (!news.length) return [];
    const impactMap = (JI.buildImpactMap ? JI.buildImpactMap(news) : {});

    const predictions = [];
    Object.values(CATEGORY).forEach(cat => {
      cat.assets.forEach(def => {
        const ticker = def.ticker;
        const tickerImpact = impactMap[ticker] || 0;
        const catImpact = impactMap[`cat:${cat.key}`] || 0;
        const allImpact = impactMap['cat:all'] || 0;
        const totalImpact = tickerImpact + catImpact + allImpact;
        if (Math.abs(totalImpact) < 1e-6) return;

        // Source headlines that targeted this asset/category/all.
        const reasons = [];
        const seen = new Set();
        news.forEach(n => {
          (n.targets || []).forEach(t => {
            const matches =
              t.scope === `asset:${ticker}` ||
              t.scope === `cat:${cat.key}` ||
              t.scope === 'cat:all';
            if (matches && !seen.has(n.sourceId || n.headline)) {
              seen.add(n.sourceId || n.headline);
              reasons.push({ headline: n.headline, icon: n.icon });
            }
          });
        });

        predictions.push({
          ticker,
          name: def.name,
          category: cat.key,
          categoryLabel: cat.label,
          totalImpact,
          direction: totalImpact > 0 ? 'up' : 'down',
          // Confidence: how much of the category's max swing this represents.
          confidence: Math.min(1, Math.abs(totalImpact) * (cat.maxSwing / Math.max(cat.maxSwing, 0.01))),
          reasons,
        });
      });
    });

    predictions.sort((a, b) => Math.abs(b.totalImpact) - Math.abs(a.totalImpact));
    return predictions.slice(0, Math.max(0, count));
  }

  function clamp(n, min, max) {
    return Math.max(min, Math.min(max, n));
  }

  /* =========================================================================
     Buy / Sell logic
     payment: { method: 'bank'|'credit', bankId }
     ========================================================================= */

  /* =========================================================================
     Broker rates (Phase 3)
     Default (no broker hired): 0.25% fee, 0% cashback
     Junior  (Rp 4M):  0.15% fee
     Senior  (Rp 15M): 0.05% fee
     Bandar  (Rp 40M): 0.00% fee + 0.10% cashback
     ========================================================================= */
  const DEFAULT_BROKER_FEE = 0.0025;
  const PPH_FINAL_RATE     = 0.001;  // 0.1% on profitable sales

  function getBrokerRates(state) {
    let rates = { feeRate: DEFAULT_BROKER_FEE, cashbackRate: 0, tier: 0 };
    if (JI.getActivePerks) {
      const perks = JI.getActivePerks(state);
      if (perks && perks.broker) {
        rates = {
          feeRate: perks.broker.feeRate,
          cashbackRate: perks.broker.cashbackRate || 0,
          tier: perks.broker.tier,
        };
      }
    }
    return rates;
  }

  function calcCost(ticker, qty) {
    const m = JI.gameState.marketAssets[ticker];
    if (!m) return 0;
    return Math.round(m.price * Number(qty || 0));
  }

  /**
   * Detailed quote for a buy: gross + broker fee + cashback + total charge.
   * Used by Buy modal preview.
   */
  function quoteBuy(state, ticker, qty) {
    const m = state.marketAssets[ticker];
    if (!m) return null;
    const grossCost = Math.round(m.price * Math.max(0, qty));
    const broker = getBrokerRates(state);
    const fee = Math.round(grossCost * broker.feeRate);
    const cashback = Math.round(grossCost * broker.cashbackRate);
    return {
      grossCost,
      fee,
      cashback,
      totalCharge: grossCost + fee,
      broker,
    };
  }

  /**
   * Detailed quote for a sell.
   */
  function quoteSell(state, ticker, qty) {
    const holding = state.portfolio.find(h => h.ticker === ticker);
    const m = state.marketAssets[ticker];
    if (!m || !holding || qty <= 0) return null;
    const q = Math.min(qty, holding.qty);
    const grossProceeds = Math.round(m.price * q);
    const costBasisShare = holding.qty > 0
      ? Math.round((holding.totalCost / holding.qty) * q)
      : 0;
    const grossPnL = grossProceeds - costBasisShare;
    const broker = getBrokerRates(state);
    const fee = Math.round(grossProceeds * broker.feeRate);
    const cashback = Math.round(grossProceeds * broker.cashbackRate);
    const pphFinal = grossPnL > 0 ? Math.round(grossPnL * PPH_FINAL_RATE) : 0;
    const netProceeds = grossProceeds - fee - pphFinal + cashback;
    return {
      qty: q,
      grossProceeds,
      costBasisShare,
      grossPnL,
      fee,
      pphFinal,
      cashback,
      netProceeds,
      netPnL: netProceeds - costBasisShare,
      broker,
    };
  }

  function buyAsset(state, ticker, qty, payment) {
    const idx = TICKER_INDEX[ticker];
    if (!idx) return { ok: false, error: 'Aset tidak ditemukan.' };
    qty = Math.floor(Number(qty) || 0);
    if (qty <= 0) return { ok: false, error: 'Jumlah harus lebih besar dari 0.' };

    const m = state.marketAssets[ticker];
    const grossCost = Math.round(m.price * qty);
    if (grossCost <= 0) return { ok: false, error: 'Nominal tidak valid.' };

    const broker = getBrokerRates(state);
    const fee = Math.round(grossCost * broker.feeRate);
    const cashback = Math.round(grossCost * broker.cashbackRate);
    const totalCharge = grossCost + fee;

    // Charge total via universal payment helper
    const charged = JI.charge(state, totalCharge, payment);
    if (!charged.ok) return { ok: false, error: charged.error };

    // Deposit cashback to chosen bank (Bandar broker perk)
    if (cashback > 0 && payment.bankId) {
      JI.deposit(state, payment.bankId, cashback);
    }

    // Track lifetime stats
    state.brokerStats = state.brokerStats || {
      totalFeesPaid: 0, totalCashbackEarned: 0, totalRealizedPnL: 0,
      profitableSells: 0, losingSells: 0,
    };
    if (fee > 0)      state.brokerStats.totalFeesPaid += fee;
    if (cashback > 0) state.brokerStats.totalCashbackEarned += cashback;

    // Update / add holding (cost basis = gross only, fees tracked separately)
    let holding = state.portfolio.find(h => h.ticker === ticker);
    if (!holding) {
      holding = {
        ticker,
        category: idx.category,
        name: idx.def.name,
        qty: 0,
        avgPrice: 0,
        totalCost: 0,
      };
      state.portfolio.push(holding);
    }
    const newQty = holding.qty + qty;
    const newCostBasis = holding.totalCost + grossCost;
    holding.qty = newQty;
    holding.totalCost = newCostBasis;
    holding.avgPrice = Math.round(newCostBasis / newQty);

    JI.recomputeNetWorth(state);

    return {
      ok: true,
      ticker,
      qty,
      price: m.price,
      grossCost,
      fee,
      cashback,
      totalCharge,
      totalCost: grossCost,    // legacy field for backward compat with toasts
      payment: charged,
      broker,
    };
  }

  function sellAsset(state, ticker, qty, bankId) {
    qty = Math.floor(Number(qty) || 0);
    if (qty <= 0) return { ok: false, error: 'Jumlah jual tidak valid.' };
    const holding = state.portfolio.find(h => h.ticker === ticker);
    if (!holding || holding.qty < qty) {
      return { ok: false, error: 'Jumlah melebihi kepemilikan.' };
    }
    const m = state.marketAssets[ticker];
    if (!m) return { ok: false, error: 'Aset tidak ditemukan.' };

    const bank = JI.getBank(state, bankId);
    if (!bank) return { ok: false, error: 'Pilih rekening bank tujuan.' };

    const grossProceeds = Math.round(m.price * qty);
    const costBasisShare = Math.round((holding.totalCost / holding.qty) * qty);
    const grossPnL = grossProceeds - costBasisShare;

    // Broker fees / cashback
    const broker = getBrokerRates(state);
    const fee = Math.round(grossProceeds * broker.feeRate);
    const cashback = Math.round(grossProceeds * broker.cashbackRate);

    // PPh Final 0.1% on profit only
    const pphFinal = grossPnL > 0 ? Math.round(grossPnL * PPH_FINAL_RATE) : 0;

    const netProceeds = grossProceeds - fee - pphFinal + cashback;

    // Credit bank with net proceeds
    bank.balance += netProceeds;
    JI.refreshBankDerived?.(bank);

    // Update holding
    holding.qty -= qty;
    holding.totalCost -= costBasisShare;
    if (holding.qty <= 0) {
      const i = state.portfolio.indexOf(holding);
      state.portfolio.splice(i, 1);
    } else {
      holding.avgPrice = Math.round(holding.totalCost / holding.qty);
    }

    // Lifetime stats
    state.brokerStats = state.brokerStats || {
      totalFeesPaid: 0, totalCashbackEarned: 0, totalRealizedPnL: 0,
      profitableSells: 0, losingSells: 0,
    };
    if (fee > 0)      state.brokerStats.totalFeesPaid += fee;
    if (cashback > 0) state.brokerStats.totalCashbackEarned += cashback;
    state.brokerStats.totalRealizedPnL += grossPnL;
    if (grossPnL > 0) state.brokerStats.profitableSells += 1;
    else if (grossPnL < 0) state.brokerStats.losingSells += 1;

    // Tax stats
    state.taxStats = state.taxStats || { totalPPhPaid: 0, totalAnnualPaid: 0, totalPenaltiesPaid: 0 };
    if (pphFinal > 0) state.taxStats.totalPPhPaid += pphFinal;

    // XP per Phase 3 spec: only on profit. 50 base + 1 per Rp 1M profit.
    let xpAwarded = 0;
    let levelEvent = null;
    if (grossPnL > 0) {
      xpAwarded = 50 + Math.floor(grossPnL / 1_000_000);
      levelEvent = JI.awardXP(state, xpAwarded);
    }

    JI.recomputeNetWorth(state);

    return {
      ok: true,
      ticker,
      qty,
      grossProceeds,
      costBasisShare,
      grossPnL,
      fee,
      cashback,
      pphFinal,
      netProceeds,
      netPnL: netProceeds - costBasisShare,
      proceeds: netProceeds, // legacy field for Phase 2 toast text
      realizedPnL: grossPnL, // legacy field
      xpAwarded,
      levelEvent,
      broker,
    };
  }

  /* =========================================================================
     Helpers
     ========================================================================= */
  function categoryLabel(key) {
    return CATEGORY[key] ? CATEGORY[key].label : key;
  }

  function formatQty(category, qty) {
    if (category === 'crypto') return qty.toLocaleString('id-ID');
    if (category === 'saham')  return `${qty.toLocaleString('id-ID')} lbr`;
    return `${qty.toLocaleString('id-ID')} unit`;
  }

  /* ---------- Expose ---------- */
  Object.assign(JI, {
    CATEGORY,
    STOCKS,
    CRYPTOS,
    REKSADANA,
    allAssets,
    getAssetDef,
    initMarket,
    calculateNextDayPrices,
    calcCost,
    quoteBuy,
    quoteSell,
    buyAsset,
    sellAsset,
    categoryLabel,
    formatQty,
    // Phase 3 additions
    predictMarketImpacts,
    getBrokerRates,
    DEFAULT_BROKER_FEE,
    PPH_FINAL_RATE,
  });
})(window);

</script>

  function generateDailyNews(state) {
    const day = state.totalDays;
    const count = JI.randomInt(1, 3);

    const pool = [...NEWS_POOL];
    // Shuffle
    for (let i = pool.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [pool[i], pool[j]] = [pool[j], pool[i]];
    }
    const picks = pool.slice(0, count).map(n => ({
      ...n,
      day,
      id: `${day}-${n.id}-${Math.random().toString(36).slice(2, 6)}`,
      sourceId: n.id,
    }));

    state.dailyNews = picks;
    state.lastNewsDay = day;
    state.newsHistory = state.newsHistory || [];
    state.newsHistory.unshift(...picks);
    // Keep history reasonable
    if (state.newsHistory.length > 200) {
      state.newsHistory.length = 200;
    }
    return picks;
  }

  /**
   * Build a ticker -> impact map from a list of news items.
   * Multiple news on same target stack additively, then are clamped in market.js.
   */
  function buildImpactMap(newsItems) {
    const map = {};
    (newsItems || []).forEach(n => {
      (n.targets || []).forEach(t => {
        if (t.scope.startsWith('asset:')) {
          const ticker = t.scope.slice('asset:'.length);
          map[ticker] = (map[ticker] || 0) + t.impact;
        } else if (t.scope.startsWith('cat:')) {
          const key = t.scope; // already 'cat:saham' etc.
          map[key] = (map[key] || 0) + t.impact;
        }
      });
    });
    return map;
  }

  Object.assign(JI, {
    NEWS_POOL,
    generateDailyNews,
    buildImpactMap,
  });
})(window);

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f172a" />
  <title>Juragan Investasi: Capitalist Tycoon</title>

  <!-- Tailwind via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            mandiri: { DEFAULT: '#003D79', accent: '#FFD700' },
            bca:     { DEFAULT: '#0060AF', accent: '#FFFFFF' },
            bni:     { DEFAULT: '#006A6E', accent: '#F26722' },
            ink:     { 950: '#070b14', 900: '#0b1220', 800: '#111a2e' }
          },
          fontFamily: {
            display: ['"Inter"', 'system-ui', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace']
          }
        }
      }
    }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="bg-slate-100 text-slate-900 font-display antialiased">

  <!-- ============================================================= -->
  <!-- INTRO SCREEN                                                  -->
  <!-- ============================================================= -->
  <div id="intro-screen"
       class="fixed inset-0 z-[9999] bg-ink-950 text-white flex items-center justify-center transition-opacity duration-700">
    <div class="text-center px-6">
      <p class="text-xs sm:text-sm uppercase tracking-[0.4em] text-slate-500 mb-4 opacity-0 animate-fade-in-1">
        a game by
      </p>
      <h1 id="intro-typer"
          class="font-mono text-2xl sm:text-4xl md:text-5xl font-semibold text-emerald-400">
        <span id="intro-text"></span><span id="intro-cursor" class="intro-cursor">|</span>
      </h1>
      <p class="mt-6 text-slate-500 text-xs sm:text-sm opacity-0 animate-fade-in-2">
        loading capitalist engine...
      </p>
    </div>
  </div>

  <!-- ============================================================= -->
  <!-- APP SHELL                                                     -->
  <!-- ============================================================= -->
  <div id="app" class="hidden min-h-screen flex flex-col">

    <!-- Desktop browser-OS chrome -->
    <header class="bg-ink-900 text-slate-100 shadow-lg sticky top-0 z-40">
      <!-- Window control bar (desktop only) -->
      <div class="hidden md:flex items-center gap-2 px-4 py-2 border-b border-white/5 bg-ink-950">
        <span class="w-3 h-3 rounded-full bg-red-500/80"></span>
        <span class="w-3 h-3 rounded-full bg-yellow-400/80"></span>
        <span class="w-3 h-3 rounded-full bg-emerald-500/80"></span>
        <div class="flex-1 mx-4">
          <div class="bg-ink-800 rounded-md px-3 py-1 text-xs text-slate-400 font-mono truncate">
            https://juraganinvestasi.id/dashboard
          </div>
        </div>
        <span class="text-[11px] text-slate-500 font-mono" id="header-clock"></span>
      </div>

      <!-- Top bar with title + stats -->
      <div class="px-4 sm:px-6 py-3 flex items-center justify-between gap-3">
        <!-- Mobile hamburger -->
        <button id="mobile-menu-btn"
                class="md:hidden p-2 -ml-2 rounded-lg hover:bg-white/5 active:bg-white/10"
                aria-label="Menu">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none"
               viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/>
          </svg>
        </button>

        <div class="flex items-center gap-3 min-w-0">
          <div class="w-9 h-9 rounded-lg bg-gradient-to-br from-emerald-400 to-teal-600 flex items-center justify-center font-bold text-ink-950 shadow">
            JI
          </div>
          <div class="min-w-0">
            <h1 class="font-bold text-sm sm:text-base leading-tight truncate">
              Juragan Investasi
            </h1>
            <p class="text-[10px] sm:text-xs text-slate-400 leading-tight truncate">
              Capitalist Tycoon
            </p>
          </div>
        </div>

        <div class="flex items-center gap-2 sm:gap-4 text-right">
          <div class="hidden sm:block">
            <p class="text-[10px] uppercase tracking-wider text-slate-400">Net Worth</p>
            <p id="header-networth" class="font-bold text-emerald-400 text-sm">Rp 0</p>
          </div>
          <div>
            <p class="text-[10px] uppercase tracking-wider text-slate-400">Tanggal</p>
            <p id="header-date" class="font-mono text-xs sm:text-sm">Hari 1, Bulan 1, Y1</p>
          </div>
        </div>
      </div>

      <!-- Desktop tab strip -->
      <nav id="desktop-tabs"
           class="hidden md:flex items-center gap-1 px-4 bg-ink-800/60 border-t border-white/5 overflow-x-auto">
        <!-- Tabs injected by ui.js -->
      </nav>
    </header>

    <!-- Mobile slide-out menu -->
    <div id="mobile-menu"
         class="fixed inset-0 z-50 hidden md:hidden">
      <div class="absolute inset-0 bg-black/60" data-close-menu></div>
      <aside class="absolute left-0 top-0 bottom-0 w-72 max-w-[80%] bg-ink-900 text-slate-100 shadow-2xl
                    flex flex-col">
        <div class="px-5 py-4 border-b border-white/10 flex items-center justify-between">
          <span class="font-semibold">Menu</span>
          <button data-close-menu class="p-1 rounded hover:bg-white/10" aria-label="Close">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none"
                 viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
            </svg>
          </button>
        </div>
        <nav id="mobile-tabs" class="flex-1 overflow-y-auto py-2">
          <!-- Tabs injected by ui.js -->
        </nav>
      </aside>
    </div>

    <!-- Main content -->
    <main id="main-content"
          class="flex-1 px-4 sm:px-6 py-5 pb-24 md:pb-8 max-w-7xl w-full mx-auto">
      <!-- Each tab is a section, only one visible at a time -->
      <section data-tab-panel="home" class="tab-panel"></section>
      <section data-tab-panel="banking" class="tab-panel hidden"></section>
      <section data-tab-panel="market" class="tab-panel hidden"></section>
      <section data-tab-panel="portfolio" class="tab-panel hidden"></section>
      <section data-tab-panel="news" class="tab-panel hidden"></section>
      <section data-tab-panel="coretax" class="tab-panel hidden"></section>
      <section data-tab-panel="hrd" class="tab-panel hidden"></section>
      <section data-tab-panel="aset" class="tab-panel hidden"></section>
    </main>

    <!-- Mobile bottom navigation -->
    <nav id="mobile-bottom-nav"
         class="md:hidden fixed bottom-0 inset-x-0 z-40 bg-ink-900 text-slate-300 border-t border-white/10
                grid grid-cols-5 text-[10px]">
      <!-- 5 quick tabs injected by ui.js, rest accessible via hamburger -->
    </nav>

    <!-- Toast container -->
    <div id="toast-container"
         class="fixed top-4 right-4 z-[60] space-y-2 max-w-sm w-[calc(100%-2rem)] sm:w-auto"></div>
  </div>

  <!-- Scripts (load order matters) -->
  <script src="js/utils.js"></script>
  <script src="js/state.js"></script>
  <script src="js/banking.js"></script>
  <script src="js/market.js"></script>
  <script src="js/portfolio.js"></script>
  <script src="js/news.js"></script>
  <script src="js/events.js"></script>
  <script src="js/loop.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
